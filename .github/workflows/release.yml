name: release

# Tag-driven npm publishing with provenance:
#   core-vX.Y.Z  -> @skillmds/core
#   vX.Y.Z       -> get-skill (and skillmds, its former name, same contents)
# The floating `v1` tag (GitHub Action pointer) never matches these globs.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "core-v[0-9]+.[0-9]+.[0-9]+"
  # Re-run a release from its tag with the workflow on main: every publish
  # step skips a version npm already has, so this finishes a release that
  # stopped half-way (2026-11-10: get-skill 1.3.11 published, skillmds did not)
  # without cutting a new version. Same file, so the same npm Trusted Publisher.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v1.3.11"
        required: true

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # get-skill's npm Trusted Publisher names this environment; skillmds' names none,
    # so it accepts either.
    environment: SkillMD
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; node 22 bundles npm 10.
      - run: npm install -g npm@latest
      - id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == core-v* ]]; then
            echo "pkg=@skillmds/core" >> "$GITHUB_OUTPUT"
            echo "dir=packages/core" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#core-v}" >> "$GITHUB_OUTPUT"
          else
            echo "pkg=get-skill" >> "$GITHUB_OUTPUT"
            echo "dir=packages/skillmds" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag must match package.json version
        run: |
          V=$(node -p "require('./${{ steps.meta.outputs.dir }}/package.json').version")
          if [ "$V" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match ${{ steps.meta.outputs.pkg }} version $V"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: get-skill only — @skillmds/core dep must resolve on the public registry
        if: steps.meta.outputs.pkg == 'get-skill'
        run: |
          RANGE=$(node -p "require('./packages/skillmds/package.json').dependencies['@skillmds/core']")
          npm view "@skillmds/core@$RANGE" version
      - name: Publish to npm (provenance)
        # Authenticates via npm Trusted Publishing (OIDC, id-token: write above);
        # both packages trust skillmds/skillmd + release.yml. No npm token needed.
        run: |
          if npm view "${{ steps.meta.outputs.pkg }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ steps.meta.outputs.pkg }}@${{ steps.meta.outputs.version }} is already on npm; skipping"
          else
            npm publish -w "${{ steps.meta.outputs.pkg }}" --provenance --access public
          fi
      - name: Also publish as skillmds (the former name), same contents
        # Existing setups run `npx skillmds`; keep them current. Never blocks
        # the release: get-skill is the package.
        # A manual re-run exists to finish this step, so there it must fail loudly.
        if: steps.meta.outputs.pkg == 'get-skill'
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          if npm view "skillmds@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "skillmds@${{ steps.meta.outputs.version }} is already on npm; skipping"
            exit 0
          fi
          cd packages/skillmds
          npm pkg set name=skillmds
          npm publish --provenance --access public
      - name: GitHub Release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${{ steps.meta.outputs.version }}" '$0 == "## " v { f = 1; next } /^## / { f = 0 } f' \
            "${{ steps.meta.outputs.dir }}/CHANGELOG.md" > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          if gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then echo "release exists; skipping"; exit 0; fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.pkg }}@${{ steps.meta.outputs.version }}" \
            --notes-file notes.md
