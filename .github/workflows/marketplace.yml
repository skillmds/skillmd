# Keep the repo's marketplace manifest in step with the registry.
#
# Claude Code's Plugins tab takes a GitHub owner/repo, not a URL, and reads
# .claude-plugin/marketplace.json from the default branch. That file therefore
# has to live here — but the registry gains plugins every day, so a hand-copied
# manifest would be wrong within a week and every new plugin would fail with
# "not found in marketplace".
name: marketplace

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-marketplace.mjs
      - name: Commit when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .claude-plugin/marketplace.json; then
            echo "no change"; exit 0
          fi
          COUNT=$(node -p "require('./.claude-plugin/marketplace.json').plugins.length")
          git commit -qm "chore: refresh the marketplace manifest ($COUNT plugins)" -- .claude-plugin/marketplace.json
          git push
